<!DOCTYPE html>
<html lang="az">

  <title>N1 Döner Zaqatala</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; font-family:Arial,Helvetica,sans-serif;
      background:radial-gradient(circle at top,#252525 0,#0b0b0b 45%,#050505 100%);
      color:#fff; display:flex; justify-content:center; padding:28px 16px;
    }
    .card{
      width:100%; max-width:460px; text-align:center;
      background:rgba(18,18,18,.92); border:1px solid #3a3a3a;
      border-radius:28px; padding:24px 18px 28px;

    .logo{

      border:4px solid #f5b719; box-shadow:0 0 28px rgba(245,183,25,.22);
      margin:4px auto 16px; display:block;
    }
    h1{margin:0;font-size:28px;letter-spacing:.5px}
    .sub{color:#d8d8d8;margin:7px 0 22px;font-size:15px}
    .btn{
      display:flex;align-items:center;justify-content:center;gap:10px;
      width:100%; padding:15px 16px; margin:11px 0;
      border-radius:14px; text-decoration:none; color:#fff;
      font-weight:700; font-size:16px; border:1px solid #3d3d3d;
      background:#191919; transition:.18s transform,.18s background;
    }
    .btn:hover{transform:translateY(-2px);background:#252525}
    .wa{background:#168a42;border-color:#168a42}.wa:hover{background:#1aa34e}
    .ig{background:linear-gradient(90deg,#833ab4,#fd1d1d,#fcb045);border:0}
    .tt{background:#111;border-color:#555}
    .map{background:#b87808;border-color:#d69715}
    .call{background:#262626}
    .icon{font-size:22px;line-height:1}
    .footer{margin-top:20px;color:#8f8f8f;font-size:12px}
  </style>
</head>
<body>
  <main class="card">

    <a class="btn wa" href="https://wa.me/994775680062" target="_blank" rel="noopener">
